name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm test
      - name: Packed CLI runs on an empty machine
        shell: bash
        run: |
          npm pack --silent
          mkdir -p "$RUNNER_TEMP/try" && cd "$RUNNER_TEMP/try"
          npm init -y > /dev/null
          npm install --silent "$GITHUB_WORKSPACE"/vectiscode-*.tgz
          npx vectiscode --version
          npx vectiscode --days 7
