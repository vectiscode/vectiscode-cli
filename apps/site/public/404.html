<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | vectiscode</title>
    <style>
        body {
            background-color: #FDF6E3;
            color: #3F3525;
            font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
            padding: 24px;
            box-sizing: border-box;
        }
        .container {
            max-width: 480px;
        }
        h1 {
            font-size: 32px;
            margin: 0 0 12px 0;
            color: #3F3525;
            font-weight: 700;
        }
        p {
            color: #6C5F49;
            font-size: 15px;
            line-height: 1.6;
            margin: 0 0 24px 0;
        }
        a {
            color: #C97822;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.15s;
        }
        a:hover {
            color: #A85F13;
        }
        .logo {
            width: 64px;
            height: 64px;
            margin-bottom: 24px;
            opacity: 0.85;
        }
    </style>
</head>
<body>
    <div class="container">
        <img class="logo" src="/images/logo-96.webp" alt="vectiscode logo">
        <h1>404 - Page not found</h1>
        <p>The page or resource you are looking for does not exist, or has been moved to a new address.</p>
        <a href="/">Go back to the homepage</a>
    </div>
</body>
</html>
